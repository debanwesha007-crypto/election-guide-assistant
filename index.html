<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Election Guide Assistant</title>
  <link rel="stylesheet" href="src/style.css" />
  <link rel="icon" href="public/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="app">

    <header id="header">
      <div id="header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h1>Election Guide Assistant</h1>
        <p>Ask me anything about elections, voting, and the democratic process</p>
      </div>
    </header>

    <div id="ctx-label">I'm interested in:</div>
    <div id="context-bar">
      <button class="ctx-btn active" data-ctx="general">General</button>
      <button class="ctx-btn" data-ctx="voter">Voter Registration</button>
      <button class="ctx-btn" data-ctx="candidate">Running for Office</button>
      <button class="ctx-btn" data-ctx="timeline">Key Timelines</button>
      <button class="ctx-btn" data-ctx="results">Understanding Results</button>
    </div>

    <div id="quick-chips"></div>
    <div id="chat" aria-live="polite" aria-label="Conversation"></div>

    <div id="input-row">
      <input
        id="user-input"
        type="text"
        placeholder="Ask about elections, voting, timelines..."
        autocomplete="off"
        aria-label="Your question"
      />
      <button id="send-btn" aria-label="Send message">Send ↗</button>
    </div>

  </div>

  <script src="src/config.js"></script>
  <script src="src/chips.js"></script>
  <script src="src/assistant.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
