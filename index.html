<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Election Guide Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --clr-primary: #185FA5;
      --clr-primary-light: #E6F1FB;
      --clr-primary-dark: #0C447C;
      --clr-bg: #ffffff;
      --clr-bg-secondary: #f5f5f3;
      --clr-border: rgba(0,0,0,0.12);
      --clr-border-strong: rgba(0,0,0,0.25);
      --clr-text: #1a1a1a;
      --clr-text-secondary: #666660;
      --clr-text-hint: #999994;
      --radius-md: 8px;
      --radius-lg: 12px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --clr-bg: #1c1c1a;
        --clr-bg-secondary: #242422;
        --clr-border: rgba(255,255,255,0.1);
        --clr-border-strong: rgba(255,255,255,0.2);
        --clr-text: #f0efe8;
        --clr-text-secondary: #a0a09a;
        --clr-text-hint: #6a6a64;
        --clr-primary-light: #0c2e4a;
      }
    }

    body {
      font-family: var(--font);
      background: var(--clr-bg-secondary);
      color: var(--clr-text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem 4rem;
    }

    #app { width: 100%; max-width: 720px; }

    #api-banner {
      background: #faeeda;
      border: 0.5px solid #BA7517;
      color: #633806;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    #api-banner a { color: #185FA5; }
    #api-banner code { background: rgba(0,0,0,0.08); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

    #header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 1rem 1.25rem;
      background: var(--clr-bg);
      border: 0.5px solid var(--clr-border);
      border-radius: var(--radius-lg);
      margin-bottom: 1rem;
    }
    #header-icon {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--clr-primary-light);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #header-icon svg { width: 22px; height: 22px; display: block; }
    #header h1 { font-size: 16px; font-weight: 500; color: var(--clr-text); }
    #header p { font-size: 13px; color: var(--clr-text-secondary); margin-top: 2px; }

    #ctx-label { font-size: 12px; color: var(--clr-text-secondary); margin-bottom: 6px; }
    #context-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
    .ctx-btn {
      padding: 6px 14px; border-radius: 999px;
      border: 0.5px solid var(--clr-border-strong);
      background: var(--clr-bg); font-size: 13px;
      color: var(--clr-text-secondary); cursor: pointer;
      transition: all 0.15s; font-family: var(--font);
    }
    .ctx-btn:hover { background: var(--clr-bg-secondary); }
    .ctx-btn.active { background: var(--clr-primary-light); border-color: var(--clr-primary); color: var(--clr-primary); font-weight: 500; }

    #quick-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; min-height: 36px; }
    .chip {
      padding: 7px 13px; border-radius: var(--radius-md);
      border: 0.5px solid var(--clr-border);
      background: var(--clr-bg); font-size: 13px;
      color: var(--clr-text-secondary); cursor: pointer;
      transition: all 0.15s; font-family: var(--font);
    }
    .chip:hover { border-color: var(--clr-primary); color: var(--clr-primary); background: var(--clr-primary-light); }

    #chat {
      display: flex; flex-direction: column; gap: 14px;
      min-height: 280px; max-height: 500px;
      overflow-y: auto; padding: 4px 0 1rem; scroll-behavior: smooth;
    }
    .msg { display: flex; gap: 10px; align-items: flex-start; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    .msg.user { flex-direction: row-reverse; }
    .bubble { padding: 10px 14px; border-radius: var(--radius-lg); max-width: 85%; font-size: 14px; line-height: 1.65; }
    .msg.ai .bubble { background: var(--clr-bg); color: var(--clr-text); border: 0.5px solid var(--clr-border); border-radius: 4px 12px 12px 12px; }
    .msg.user .bubble { background: var(--clr-primary); color: #fff; border-radius: 12px 4px 12px 12px; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; font-weight: 500; }
    .ai-avatar { background: var(--clr-primary-light); color: var(--clr-primary); }
    .user-avatar { background: #eaf3de; color: #3b6d11; }

    .typing { display: flex; gap: 5px; padding: 12px 14px; align-items: center; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--clr-text-secondary); animation: bounce 0.9s infinite; }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.30s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

    #input-row { display: flex; gap: 8px; margin-top: 0.75rem; }
    #user-input {
      flex: 1; padding: 11px 14px; border-radius: var(--radius-lg);
      border: 0.5px solid var(--clr-border-strong);
      background: var(--clr-bg); font-size: 14px; color: var(--clr-text);
      font-family: var(--font); outline: none; transition: border 0.15s;
    }
    #user-input:focus { border-color: var(--clr-primary); }
    #user-input::placeholder { color: var(--clr-text-hint); }
    #send-btn {
      padding: 11px 20px; border-radius: var(--radius-lg);
      border: none; background: var(--clr-primary);
      color: #fff; font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: var(--font); transition: background 0.15s;
    }
    #send-btn:hover { background: var(--clr-primary-dark); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: var(--clr-border); border-radius: 4px; }

    @media (max-width: 480px) {
      body { padding: 1rem 0.5rem 3rem; }
      .bubble { max-width: 92%; font-size: 13px; }
      .ctx-btn { font-size: 12px; padding: 5px 11px; }
    }
  </style>
</head>
<body>
<div id="app">

  <header id="header">
    <div id="header-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
    </div>
    <div>
      <h1>Election Guide Assistant</h1>
      <p>Ask me anything about elections, voting, and the democratic process</p>
    </div>
  </header>

  <div id="ctx-label">I'm interested in:</div>
  <div id="context-bar">
    <button class="ctx-btn active" data-ctx="general">General</button>
    <button class="ctx-btn" data-ctx="voter">Voter Registration</button>
    <button class="ctx-btn" data-ctx="candidate">Running for Office</button>
    <button class="ctx-btn" data-ctx="timeline">Key Timelines</button>
    <button class="ctx-btn" data-ctx="results">Understanding Results</button>
  </div>

  <div id="quick-chips"></div>
  <div id="chat" aria-live="polite"></div>

  <div id="input-row">
    <input id="user-input" type="text" placeholder="Ask about elections, voting, timelines..." autocomplete="off" />
    <button id="send-btn">Send ↗</button>
  </div>

</div>
<script>
  // ── PASTE YOUR FREE GEMINI API KEY BELOW ──────────────────────────
  const API_KEY = "AIzaSyBuTAr8pfkB2te01qNko8dkzLOcyDVdyac";
  // Get it free at: https://aistudio.google.com/app/apikey
  // ──────────────────────────────────────────────────────────────────

  const MODEL = "gemini-2.5-flash";

  const CTX_MAP = {
    general:   "You are helping a general member of the public understand elections.",
    voter:     "The user is interested in voter registration, eligibility, and the voting process.",
    candidate: "The user is interested in running for office, filing requirements, and candidate procedures.",
    timeline:  "The user wants to understand election timelines, important dates, and key deadlines.",
    results:   "The user wants to understand how votes are counted, certified, and results declared.",
  };

  const SYSTEM = `You are a friendly, clear, and knowledgeable Election Process Guide Assistant.
Help users understand: how elections work, voter registration, voting methods, candidate filing,
vote counting and certification, electoral systems, election timelines, and post-election processes.
Be clear, neutral, and nonpartisan. Use simple language. Keep responses to 3-5 paragraphs max.
Use numbered lists for steps or timelines. Note when processes vary by country or region.`;

  const CHIP_SETS = {
    general:   [["How does an election work?","How does the election process work from start to finish?"],["Electoral systems","What are the different types of electoral systems used around the world?"],["Who runs elections?","Who is responsible for administering and overseeing elections?"],["Election day","What happens on election day from polls opening to closing?"]],
    voter:     [["How to register","How do I register to vote and what documents do I need?"],["Registration deadlines","When is the deadline to register to vote?"],["Absentee voting","How does absentee or mail-in voting work?"],["Early voting","What are my early voting options?"]],
    candidate: [["How to file","How does a candidate officially file to run for office?"],["Ballot access","How do candidates get their name on the ballot?"],["Campaign finance","What are the rules around campaign financing and donations?"],["Primary vs general","What is the difference between a primary and a general election?"]],
    timeline:  [["Full timeline","Walk me through a complete election timeline from filing to certification."],["Primary timing","When do primary elections typically take place?"],["Certification","How long does it take to certify election results?"],["To inauguration","What happens between election day and inauguration?"]],
    results:   [["How votes are counted","How are votes counted and who oversees the process?"],["Certification","How are election results officially certified?"],["Recount rules","When can a candidate request a recount?"],["Electoral college","How does the electoral college system work?"]],
  };

  let activeCtx = "general";
  const chatEl  = document.getElementById("chat");
  const inputEl = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");

  if (API_KEY === "AIzaSyBuTAr8pfkB2te01qNko8dkzLOcyDVdyac") {
    const b = document.createElement("div");
    b.id = "api-banner";
    b.innerHTML = `⚠️ <strong>API key not set.</strong> Open <code>index.html</code> and replace <code>AIzaSyBuTAr8pfkB2te01qNko8dkzLOcyDVdyac</code> with your free key from <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com</a>.`;
    document.getElementById("app").insertBefore(b, document.getElementById("ctx-label"));
  }

  function renderChips() {
    const c = document.getElementById("quick-chips");
    c.innerHTML = "";
    (CHIP_SETS[activeCtx] || CHIP_SETS.general).forEach(([label, q]) => {
      const btn = document.createElement("button");
      btn.className = "chip";
      btn.textContent = label;
      btn.onclick = () => send(q);
      c.appendChild(btn);
    });
  }

  function addMsg(role, html) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    const av = document.createElement("div");
    av.className = "avatar " + (role === "ai" ? "ai-avatar" : "user-avatar");
    av.textContent = role === "ai" ? "EG" : "You";
    const bub = document.createElement("div");
    bub.className = "bubble";
    bub.innerHTML = html;
    wrap.appendChild(av);
    wrap.appendChild(bub);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function showTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg ai";
    wrap.id = "typing";
    wrap.innerHTML = `<div class="avatar ai-avatar">EG</div><div class="bubble typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function fmt(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.*?)\*/g, "<em>$1</em>")
      .replace(/\n\n/g, "<br><br>")
      .replace(/\n(\d+\.)/g, "<br>$1")
      .replace(/\n- /g, "<br>• ");
  }

  async function send(text) {
    text = text || inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    sendBtn.disabled = true;
    document.getElementById("quick-chips").style.display = "none";
    addMsg("user", text);
    showTyping();

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM + "\n\n" + CTX_MAP[activeCtx] }] },
          contents: [{ role: "user", parts: [{ text }] }],
          generationConfig: { maxOutputTokens: 1000, temperature: 0.7 }
        })
      });

      const data = await res.json();
      document.getElementById("typing")?.remove();

      if (!res.ok) {
        const msg = data?.error?.message || "API error";
        if (msg.includes("API_KEY_INVALID") || msg.includes("key not valid")) {
          addMsg("ai", "⚠️ Your API key is invalid. Please check <code>index.html</code> and make sure you pasted the key correctly from <a href='https://aistudio.google.com/app/apikey' target='_blank'>aistudio.google.com</a>.");
        } else {
          addMsg("ai", "Error: " + msg);
        }
      } else {
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't generate a response. Please try again.";
        addMsg("ai", fmt(reply));
      }
    } catch (e) {
      document.getElementById("typing")?.remove();
      addMsg("ai", "Connection error. Please check your internet connection and try again.");
      console.error(e);
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  document.querySelectorAll(".ctx-btn").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".ctx-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCtx = btn.dataset.ctx;
      renderChips();
    };
  });

  sendBtn.onclick = () => send();
  inputEl.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

  renderChips();
  addMsg("ai", "Hello! I'm your <strong>Election Guide Assistant</strong>, powered by Google Gemini. I can help you understand how elections work — from voter registration and ballot access to vote counting and result certification.<br><br>Choose a topic above or ask me anything!");
</script>
</body>
</html>
